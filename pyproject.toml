[project]
name = "docta-pipeline"
version = "0"
description = "Build-time data and edition pipeline for DoCTA"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.3,<7",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pyshacl>=0.30,<1",
    "rdflib>=7.1,<8",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5,<5",
    "pytest>=8.3,<10",
    "ruff>=0.15,<1",
]

[tool.pytest.ini_options]
testpaths = ["pipeline", "evaluation/checks"]
python_files = ["test_*.py"]
pythonpath = ["."]
markers = [
    "slow: full working-tree healthcheck; excluded by default, run explicitly via -m slow",
]
addopts = "-m \"not slow\""

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Historical one-off fetch and transform scripts: the stdout re-wrap statement
# precedes the imports (E402) and os.path/open idioms stay as written (PTH).
"scripts/*" = ["E402", "PTH"]
# Deliberate typographic multiplication sign in German console output.
"evaluation/benchmark/run_benchmark.py" = ["RUF001"]
# The en dash in SEPARATORS is a token of the source material, never a typo.
"evaluation/checks/check_amounts.py" = ["RUF001"]
# Frozen experiment; the ambiguous loop name stays as run.
"experiments/**" = ["E741"]
