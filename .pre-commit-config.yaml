# Local system hooks only: building the remote hook environments fails on this
# machine (Windows Store Python hits MAX_PATH while seeding virtualenv). The
# venv's own tools cover the same ground: ruff for lint and format, and the
# pipeline healthcheck as the actual gate, which validates JSON artifacts, both
# TEI schemas and the byte-identical rebuild on its own.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: ./.venv/Scripts/ruff.exe check --fix
        language: system
        types_or: [python]
      - id: ruff-format
        name: ruff format
        entry: ./.venv/Scripts/ruff.exe format
        language: system
        types_or: [python]
      # Stand-in for the upstream check-added-large-files, which cannot be
      # installed here: it asks git for the newly added files itself, so the
      # large files already tracked (tei_all.rng, the SiCProD exports) stay
      # untouched and `pre-commit run --all-files` sees nothing staged.
      - id: no-large-added-files
        name: block newly added files over 1 MB
        entry: ./.venv/Scripts/python.exe -c 'import subprocess,sys; from pathlib import Path; A=subprocess.run("git diff --cached --name-only --diff-filter=A".split(),capture_output=True,text=True).stdout.split(); sys.exit("\n".join(p for p in A if Path(p).is_file() and Path(p).stat().st_size > 1048576) or 0)'
        language: system
        pass_filenames: false
        always_run: true

      - id: docta-healthcheck
        name: DoCTA pipeline healthcheck (both schemas, byte-identical rebuild)
        entry: ./.venv/Scripts/python.exe pipeline/check_pipeline.py
        language: system
        pass_filenames: false
        always_run: true
