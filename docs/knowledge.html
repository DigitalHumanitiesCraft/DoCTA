<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Vault | DoCTA</title>
  <meta name="description" content="Promptotyping knowledge base: requirements, data, context, tech and decision journal of the DoCTA project.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      <!-- Sidebar -->
      <aside class="kv-sidebar col-lg-3 col-xl-2 border-end py-3 px-3">
        <h2 class="h6 text-body-secondary mb-3">Knowledge Vault</h2>
        <nav id="kv-nav" aria-label="Knowledge documents"></nav>
      </aside>

      <!-- Content -->
      <main id="main" class="col-lg-9 col-xl-10 py-4 px-4">
        <div id="kv-content" class="kv-content"></div>
      </main>
    </div>
  </div>

  <footer class="text-center py-4 border-top small text-body-secondary">
    <p class="mb-0 footer-line"><span>DoCTA</span> <span class="footer-sep">·</span>
      <a href="https://dhcraft.org" target="_blank" rel="noopener">Digital Humanities Craft</a>
      <span class="footer-sep">·</span>
      <a href="https://github.com/DigitalHumanitiesCraft/DoCTA" target="_blank" rel="noopener">GitHub</a>
      <span class="footer-sep">·</span>
      <a href="https://dhcraft.org/Promptotyping/" target="_blank" rel="noopener">Promptotyping</a>
      <span class="footer-sep">·</span> <a href="about.html">About &amp; Imprint</a></p>
  </footer>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="lib/marked.min.js"></script>
  <script type="module">
    import { initNav, initBanner } from './js/app.js';

    initNav('knowledge');
    initBanner();

    const DOCS = [
      { id: 'index',        file: 'knowledge/INDEX.md',        title: 'Overview',          desc: 'Map of content and reading order' },
      { id: 'project',      file: 'knowledge/project.md',      title: 'Project',            desc: 'Charter: what, for whom, on what material' },
      { id: 'specification', file: 'knowledge/specification.md', title: 'Specification',    desc: 'Review critique, goals, constraints' },
      { id: 'data',         file: 'knowledge/data.md',         title: 'Data',               desc: 'SiCProD, CSV, Transkribus, quality' },
      { id: 'htr-evaluation', file: 'knowledge/htr-evaluation.md', title: 'HTR Evaluation', desc: 'Transcription, references, review specification' },
      { id: 'domain-knowledge', file: 'knowledge/domain-knowledge.md', title: 'Domain Knowledge', desc: 'Data model, praxeology, BeNASch' },
      { id: 'editorial-model', file: 'knowledge/editorial-model.md', title: 'Editorial Model', desc: 'Editorial objects, evidence, decisions' },
      { id: 'accounting-encoding', file: 'knowledge/accounting-encoding.md', title: 'Accounting Encoding', desc: 'Machine-readable accounts specification' },
      { id: 'architecture', file: 'knowledge/architecture.md', title: 'Architecture',       desc: 'Libraries, project structure, design system' },
      { id: 'design',       file: 'knowledge/design.md',       title: 'Design',             desc: 'Design decisions and rejected alternatives' },
      { id: 'journal',      file: 'knowledge/journal.md',      title: 'Journal',            desc: 'Decisions, exploration, dead ends' },
      { id: 'handoff',      file: 'knowledge/handoff.md',      title: 'Handoff',            desc: 'Open handoff points (process inbox)' },
    ];
    // Legacy uppercase anchors from before the lowercase naming contract
    const LEGACY_IDS = {
      'INDEX': 'index', 'REQUIREMENTS': 'specification', 'DATA': 'data',
      'HTR-EVALUATION': 'htr-evaluation', 'CONTEXT': 'domain-knowledge',
      'EDITORIAL-MODEL': 'editorial-model', 'ACCOUNTING-ENCODING': 'accounting-encoding',
      'TECH': 'architecture', 'DESIGN': 'design', 'JOURNAL': 'journal',
    };

    const navEl = document.getElementById('kv-nav');
    const contentEl = document.getElementById('kv-content');
    const cache = {};

    // Build sidebar
    navEl.innerHTML = DOCS.map(d =>
      `<a class="kv-sidebar-item" href="#${d.id}" data-doc="${d.id}">
        <span class="kv-title">${d.title}</span>
        <span class="kv-desc">${d.desc}</span>
      </a>`
    ).join('');

    // Welcome state
    function showWelcome() {
      contentEl.innerHTML = `
        <h1 class="mb-3">Knowledge Vault</h1>
        <div class="list-group">
          ${DOCS.map(d => `
            <a href="#${d.id}" class="list-group-item list-group-item-action">
              <strong>${d.title}</strong>
              <span class="text-body-secondary ms-2">${d.desc}</span>
            </a>
          `).join('')}
        </div>
      `;
    }

    // Load and render a document
    async function loadDoc(id) {
      const doc = DOCS.find(d => d.id === id);
      if (!doc) { showWelcome(); return; }

      // Update active sidebar
      navEl.querySelectorAll('.kv-sidebar-item').forEach(el => {
        const isActive = el.dataset.doc === id;
        el.classList.toggle('active', isActive);
        // Active state must not rest on colour alone
        if (isActive) el.setAttribute('aria-current', 'page');
        else el.removeAttribute('aria-current');
      });

      // Show loading
      contentEl.innerHTML = `<div class="loading"><div class="loading__spinner"></div>Loading document...</div>`;

      try {
        if (!cache[id]) {
          const resp = await fetch(doc.file);
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          // Strip YAML frontmatter; marked would render it as literal text
          cache[id] = (await resp.text()).replace(/^---\r?\n[\s\S]*?\r?\n---\r?\n/, '');
        }
        contentEl.innerHTML = marked.parse(cache[id]);
      } catch (err) {
        contentEl.innerHTML = `<div class="alert alert-warning">Document could not be loaded: ${doc.file}</div>`;
        console.error('Knowledge load error:', err);
      }
    }

    // Hash routing
    function onHash() {
      let hash = location.hash.replace('#', '');
      if (LEGACY_IDS[hash]) hash = LEGACY_IDS[hash];
      if (hash && DOCS.find(d => d.id === hash)) {
        loadDoc(hash);
      } else {
        showWelcome();
        navEl.querySelectorAll('.kv-sidebar-item').forEach(el => {
          el.classList.remove('active');
          el.removeAttribute('aria-current');
        });
      }
    }

    window.addEventListener('hashchange', onHash);
    onHash();
  </script>
</body>
</html>
