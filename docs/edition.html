<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edition | DoCTA</title>
  <meta name="description" content="Reading view of the DoCTA edition: diplomatic transcriptions of the Tyrolean court records, page by page.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container py-4">
    <header class="mb-3 d-flex flex-wrap gap-3 align-items-center">
      <h1 class="mb-0">Edition</h1>
      <span class="badge text-bg-warning">Unrevised draft</span>
      <select class="form-select form-select-sm w-auto ms-lg-auto" id="doc-selector" aria-label="Select document">
        <option value="">Choose a document...</option>
      </select>
    </header>
    <p class="small text-body-secondary mb-4" id="edition-meta" hidden></p>

    <article class="edition-text" id="edition-text" aria-live="polite"></article>
  </main>

  <footer class="text-center py-4 border-top small text-body-secondary">
    <p class="mb-0">DoCTA | Digital Humanities Craft OG</p>
  </footer>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initNav, initBanner } from './js/app.js';
    import { loadJSON } from './js/data-loader.js';
    import { getParams, setParams, escapeHTML } from './js/utils.js';

    initNav('edition');
    initBanner();

    let sourceByDocId = new Map();

    function renderDoc(doc) {
      const meta = document.getElementById('edition-meta');
      const s = sourceByDocId.get(Number(doc.docId));
      if (s) {
        meta.innerHTML = `<span class="font-monospace">${escapeHTML(s.signatur)}</span> · ${escapeHTML(s.titel)}` +
          (s.datierung?.raw ? ` · ${escapeHTML(s.datierung.raw)}` : '') + ` · Tyrolean State Archives`;
        meta.hidden = false;
      } else {
        meta.hidden = true;
      }
      const out = [];
      for (const page of doc.pages) {
        const lines = page.regions.flatMap(r => r.lines.map(l => l.text));
        if (!lines.length) continue;
        out.push(`<section class="edition-page">
          <div class="edition-page__head">
            <span>Page ${page.pageNr}</span>
            <a class="small" href="viewer.html?doc=${doc.docId}&page=${page.pageNr}">Facsimile</a>
          </div>
          ${lines.map(t => `<div class="edition-line">${escapeHTML(t)}</div>`).join('')}
        </section>`);
      }
      document.getElementById('edition-text').innerHTML = out.join('') ||
        `<p class="text-body-secondary">No text available for this document.</p>`;
    }

    async function loadDocument(docId) {
      try {
        const doc = await loadJSON(`data/transcriptions/${docId}.json`);
        renderDoc(doc);
        setParams({ doc: String(docId) });
      } catch (err) {
        document.getElementById('edition-text').innerHTML =
          `<p class="text-body-secondary">Document ${escapeHTML(String(docId))} could not be loaded: ${escapeHTML(err.message)}</p>`;
      }
    }

    document.getElementById('doc-selector').addEventListener('change', (e) => {
      if (e.target.value) loadDocument(e.target.value);
    });

    async function init() {
      const [mapping, sources] = await Promise.all([
        loadJSON('data/source_mapping.json'),
        loadJSON('data/sources.json').catch(() => []),
      ]);
      sourceByDocId = new Map(sources
        .filter(s => s.transkribus?.doc_id)
        .map(s => [Number(s.transkribus.doc_id), s]));

      const selector = document.getElementById('doc-selector');
      const docsWithText = mapping.matched
        .filter(m => m.has_text)
        .sort((a, b) => a.csv_signatur.localeCompare(b.csv_signatur));
      for (const doc of docsWithText) {
        const opt = document.createElement('option');
        opt.value = doc.transkribus_id;
        opt.textContent = `${doc.csv_signatur} - ${doc.csv_titel}`;
        selector.appendChild(opt);
      }

      const params = getParams();
      const start = params.doc || (docsWithText.length ? String(docsWithText[0].transkribus_id) : '');
      if (start) {
        selector.value = start;
        loadDocument(start);
      }
    }

    init().catch(err => console.error('Edition init failed:', err));
  </script>
</body>
</html>
