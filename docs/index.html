<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoCTA | Agentic Edition Pipeline</title>
  <meta name="description" content="DoCTA: agentic edition pipeline for the court records of Sigismund of Tyrol (1427–1496). From Transkribus facsimiles to research data and a digital edition.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container py-4">
    <header class="mb-4">
      <h1>Doing Court in the Tyrolean Alps</h1>
    </header>

    <!-- Sources with integrated search -->
    <section class="mb-4" id="sources">
      <h2 class="visually-hidden">Sources</h2>

      <div class="progress-block mb-4">
        <div class="progress-stack" id="progress-bar" role="img" aria-label="Editorial progress"></div>
        <ul class="progress-legend" id="progress-legend"></ul>
      </div>

      <div class="row g-2 mb-2 align-items-center">
        <div class="col-md-5">
          <input type="search" class="form-control" id="search-input" placeholder="Search shelfmark, title or date..." aria-label="Source search">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="sort-select" aria-label="Sort sources">
            <option value="signatur">Sort by shelfmark</option>
            <option value="titel">Sort by title</option>
            <option value="datierung">Sort by date</option>
            <option value="seiten">Sort by pages</option>
            <option value="tier">Sort by progress</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="form-select" id="filter-tier" aria-label="Filter by availability">
            <option value="">Any progress</option>
            <option value="1">Has HTR text</option>
            <option value="2">Digitized</option>
            <option value="3">Archive only</option>
          </select>
        </div>
        <div class="col-md-2 text-md-end">
          <span class="small text-body-secondary" id="result-count" role="status" aria-live="polite"></span>
        </div>
      </div>

      <div class="chip-row mb-3" id="category-chips" role="group" aria-label="Filter by category"></div>

      <ul class="src-list" id="sources-list"></ul>
    </section>

  </main>

  <footer class="text-center py-4 border-top small text-body-secondary">
    <p class="mb-0 footer-line"><span>DoCTA</span> <span class="footer-sep">·</span>
      <a href="https://dhcraft.org" target="_blank" rel="noopener">Digital Humanities Craft</a>
      <span class="footer-sep">·</span>
      <a href="https://github.com/DigitalHumanitiesCraft/DoCTA" target="_blank" rel="noopener">GitHub</a>
      <span class="footer-sep">·</span>
      <a href="https://dhcraft.org/Promptotyping/" target="_blank" rel="noopener">Promptotyping</a>
      <span class="footer-sep">·</span> <a href="about.html">About &amp; Imprint</a></p>
  </footer>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initNav, initBanner } from './js/app.js';
    import { loadJSON } from './js/data-loader.js';
    import { escapeHTML, escapeAttr, formatDate, debounce, catLabel, formatCount as num } from './js/utils.js';

    initNav('dashboard');
    initBanner();

    // Doc ids whose TEI the pipeline has produced, from the register projection.
    // A source without an entry there counts as not yet encoded.
    let teiDocIds = new Set();

    // Pipeline progress per source: filled = reached, outline = pending.
    // Edited stays pending for the whole corpus until that stage ships.
    function stageIcons(s) {
      const docId = s.transkribus?.doc_id;
      const stages = [
        { key: 'F', label: 'Facsimile', done: s.tier === 1 || s.tier === 2 },
        { key: 'H', label: 'HTR text', done: !!(s.transkribus && s.transkribus.has_text) },
        { key: 'T', label: 'TEI', done: docId != null && teiDocIds.has(Number(docId)) },
        { key: 'E', label: 'Edited', done: false },
      ];
      return `<span class="stages">` + stages.map(st =>
        `<span class="stage ${st.done ? 'stage--done' : 'stage--todo'}" title="${st.label}${st.done ? '' : ': pending'}">${st.key}<span class="visually-hidden"> ${st.label}${st.done ? ' done' : ' pending'}</span></span>`
      ).join('') + `</span>`;
    }

    let allSources = [];
    let thumbByDocId = new Map();
    let sortKey = 'signatur';
    let katFilter = '';

    const hasText = (s) => !!(s.transkribus && s.transkribus.has_text);

    // Availability groups the list before any user-chosen sort: full text, then
    // digitized facsimile, then sources known only from the finding aid.
    const availRank = (s) => (hasText(s) ? 0 : s.tier === 2 ? 1 : 2);

    // Scaled IIIF variant of the first written page; the image stays external.
    // The thumbnail is presentational, the title link carries the row target.
    function thumbMarkup(s) {
      const docId = s.transkribus?.doc_id;
      const t = docId ? thumbByDocId.get(Number(docId)) : null;
      if (t) {
        const src = t.thumb.replace('/full/max/', '/full/,120/');
        return `<img class="src-thumb" src="${escapeAttr(src)}" alt="" loading="lazy" decoding="async">`;
      }
      const initial = (catLabel(s.kategorie) || '?').trim().charAt(0).toUpperCase();
      return `<span class="src-thumb src-thumb--empty" aria-hidden="true">${escapeHTML(initial)}</span>`;
    }

    function rowMarkup(s) {
      const pages = s.seiten != null ? `${num(s.seiten)} page${s.seiten === 1 ? '' : 's'}` : '';
      const meta = [
        `<span class="src-sig">${escapeHTML(s.signatur)}</span>`,
        `<span>${escapeHTML(formatDate(s.datierung))}</span>`,
        pages ? `<span class="tnum">${pages}</span>` : '',
      ].filter(Boolean).join('<span class="src-meta__sep" aria-hidden="true">·</span>');
      const title = hasText(s)
        ? `<a class="src-title" href="viewer.html?doc=${encodeURIComponent(s.transkribus.doc_id)}" title="${escapeAttr(s.titel)}">${escapeHTML(s.titel)}</a>`
        : `<span class="src-title" title="${escapeAttr(s.titel)}">${escapeHTML(s.titel)}</span>`;
      return `<li class="src-row">
        ${thumbMarkup(s)}
        <div class="src-main">${title}<div class="src-meta">${meta}</div></div>
        <div class="src-cat">${escapeHTML(catLabel(s.kategorie))}</div>
        <div class="src-stages">${stageIcons(s)}</div>
      </li>`;
    }

    function renderList(sources) {
      const list = document.getElementById('sources-list');
      document.getElementById('result-count').textContent = `${num(sources.length)} sources`;

      if (sources.length === 0) {
        list.innerHTML = '<li class="src-empty text-body-secondary">No sources found</li>';
        return;
      }
      list.innerHTML = sources.map(rowMarkup).join('');
    }

    function sortValue(s, key) {
      if (key === 'datierung') return s.datierung.start || 0;
      if (key === 'seiten') return s.seiten || 0;
      if (key === 'tier') return s.tier;
      return s[key];
    }

    function getFilteredSources() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const tierFilter = document.getElementById('filter-tier').value;

      let filtered = allSources;

      if (query) {
        filtered = filtered.filter(s =>
          s.signatur.toLowerCase().includes(query) ||
          s.titel.toLowerCase().includes(query) ||
          (s.datierung.raw || '').toLowerCase().includes(query)
        );
      }

      if (katFilter) {
        filtered = filtered.filter(s => s.kategorie === katFilter);
      }

      if (tierFilter) {
        filtered = filtered.filter(s => s.tier === parseInt(tierFilter));
      }

      return [...filtered].sort((a, b) => {
        const rank = availRank(a) - availRank(b);
        if (rank !== 0) return rank;
        const va = sortValue(a, sortKey);
        const vb = sortValue(b, sortKey);
        const cmp = typeof va === 'string'
          ? va.localeCompare(vb, 'de', { numeric: true })
          : (va || 0) - (vb || 0);
        if (cmp !== 0) return cmp;
        return a.signatur.localeCompare(b.signatur, 'de', { numeric: true });
      });
    }

    function update() {
      renderList(getFilteredSources());
    }

    // Corpus-wide editorial progress over pages. Verification counts come from the
    // register, pages of sources outside the register count as untranscribed.
    function renderProgress(sources, register) {
      const totalPages = sources.reduce((acc, s) => acc + (s.seiten || 0), 0);
      const docIds = new Set(sources.filter(s => s.transkribus).map(s => Number(s.transkribus.doc_id)));
      const v = { abgenommen: 0, gesichtet: 0, maschinell: 0 };
      let pagesWithText = 0;
      if (register) {
        register.documents
          .filter(d => docIds.has(Number(d.docId)))
          .forEach(d => {
            pagesWithText += d.pages_with_text || 0;
            Object.keys(v).forEach(k => { v[k] += (d.verification && d.verification[k]) || 0; });
          });
      }
      const verified = v.abgenommen + v.gesichtet + v.maschinell;
      const segments = [
        { cls: 'approved', label: 'approved', n: v.abgenommen },
        { cls: 'reviewed', label: 'reviewed', n: v.gesichtet },
        { cls: 'machine', label: 'machine-checked', n: v.maschinell },
        { cls: 'text', label: 'pages with machine text', n: Math.max(0, pagesWithText - verified) },
        { cls: 'none', label: 'not yet transcribed', n: Math.max(0, totalPages - pagesWithText) },
      ].filter(seg => seg.n > 0);

      const bar = document.getElementById('progress-bar');
      const pct = (n) => totalPages > 0 ? (n / totalPages) * 100 : 0;
      bar.innerHTML = segments.map(seg =>
        `<span class="progress-seg progress-seg--${seg.cls}" style="width:${pct(seg.n).toFixed(3)}%"></span>`
      ).join('');
      const summary = segments.map(seg => `${num(seg.n)} ${seg.label}`).join(', ');
      bar.setAttribute('aria-label', `Editorial progress over ${num(totalPages)} corpus pages: ${summary}`);

      document.getElementById('progress-legend').innerHTML = segments.map(seg =>
        `<li class="progress-legend__item"><span class="progress-swatch progress-seg--${seg.cls}" aria-hidden="true"></span><span class="tnum">${num(seg.n)}</span> ${escapeHTML(seg.label)}</li>`
      ).join('');
    }

    function renderChips(sources) {
      const counts = new Map();
      sources.forEach(s => counts.set(s.kategorie, (counts.get(s.kategorie) || 0) + 1));
      // The All chip carries no count; the result-count line already shows it.
      const chips = [{ value: '', label: 'All', n: null }].concat(
        [...counts.keys()].sort((a, b) => catLabel(a).localeCompare(catLabel(b), 'en'))
          .map(k => ({ value: k, label: catLabel(k), n: counts.get(k) }))
      );
      const row = document.getElementById('category-chips');
      row.innerHTML = chips.map(c =>
        `<button type="button" class="chip" data-kat="${escapeAttr(c.value)}" aria-pressed="${c.value === katFilter}">${escapeHTML(c.label)}${c.n != null ? `<span class="chip__count tnum">${num(c.n)}</span>` : ''}</button>`
      ).join('');
    }

    function setCategory(value) {
      katFilter = value;
      document.querySelectorAll('#category-chips .chip').forEach(btn => {
        btn.setAttribute('aria-pressed', String(btn.dataset.kat === katFilter));
      });
      update();
    }

    document.getElementById('search-input').addEventListener('input', debounce(update, 200));
    document.getElementById('filter-tier').addEventListener('change', update);
    document.getElementById('sort-select').addEventListener('change', (e) => {
      sortKey = e.target.value;
      update();
    });
    document.getElementById('category-chips').addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (btn) setCategory(btn.dataset.kat);
    });

    async function initSources() {
      try {
        const [sources, register] = await Promise.all([
          loadJSON('data/sources.json'),
          loadJSON('data/pipeline/register_summary.json').catch(() => null),
        ]);
        allSources = sources;
        if (register) {
          thumbByDocId = new Map(register.documents
            .filter(d => d.thumb)
            .map(d => [d.docId, { thumb: d.thumb, thumb_page: d.thumb_page }]));
          teiDocIds = new Set(register.documents
            .filter(d => d.has_tei)
            .map(d => Number(d.docId)));
        }

        renderProgress(allSources, register);
        renderChips(allSources);
        update();
      } catch (err) {
        const li = document.createElement('li');
        li.className = 'src-empty text-body-secondary';
        li.textContent = `Loading failed: ${err.message}`;
        document.getElementById('sources-list').replaceChildren(li);
      }
    }

    initSources();
  </script>
</body>
</html>
