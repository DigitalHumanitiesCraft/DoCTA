<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quellen | DoCTA</title>
  <meta name="description" content="Quellen zur Tiroler Hofverwaltung mit Digitalisaten und Transkriptionen in der Arbeitsedition DoCTA.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="sources-page">
  <a class="skip-link" href="#main">Zum Inhalt</a>
  <nav class="navbar navbar-expand-lg bg-white sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Navigation öffnen">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>
  <main id="main" class="container py-4">
    <h1>Quellen</h1>
    <section id="sources" aria-label="Quellenverzeichnis">
      <div class="list-controls">
        <form class="sources-filters" role="search">
          <label for="search-input">Quellen suchen
            <input type="search" class="form-control" id="search-input" placeholder="Signatur, Titel oder Datierung" autocomplete="off">
          </label>
          <label for="sort-select">Sortierung
            <select class="form-select" id="sort-select">
              <option value="signatur">Signatur</option>
              <option value="titel">Titel</option>
              <option value="datierung">Datierung</option>
              <option value="images">Anzahl der Digitalisate</option>
            </select>
          </label>
          <label for="filter-availability">Verfügbarkeit
            <select class="form-select" id="filter-availability">
              <option value="">Alle Quellen</option>
              <option value="text">Mit Transkription</option>
              <option value="images">Nur Digitalisat</option>
              <option value="catalogue">Nur Katalognachweis</option>
            </select>
          </label>
        </form>
        <div class="chip-row" id="category-chips" role="group" aria-label="Quellenart"></div>
        <p id="result-count" role="status" aria-live="polite"></p>
      </div>
      <ul class="src-list" id="sources-list" role="list"><li class="src-empty">Quellen werden geladen.</li></ul>
    </section>
  </main>
  <footer class="text-center py-4 small text-body-secondary"></footer>
  <script src="lib/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/sources.js"></script>
</body>
</html>
