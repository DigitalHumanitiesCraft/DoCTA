<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoCTA | Agentic Edition Pipeline</title>
  <meta name="description" content="DoCTA: agentic edition pipeline for the court records of Sigismund of Tyrol (1427–1496). From Transkribus facsimiles to research data and a digital edition.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>

  <main id="main" class="container py-4">
    <header class="mb-4">
      <h1>Doing Court in the Tyrolean Alps</h1>
    </header>

    <!-- Sources with integrated search -->
    <section class="mb-4" id="sources">
      <h2 class="h5 mb-3">Sources</h2>

      <div class="row g-2 mb-3 align-items-center">
        <div class="col-md-5">
          <input type="search" class="form-control" id="search-input" placeholder="Search shelfmark, title or date..." aria-label="Source search">
        </div>
        <div class="col-md-3">
          <select class="form-select" id="filter-kategorie" aria-label="Filter by category">
            <option value="">All categories</option>
          </select>
        </div>
        <div class="col-md-2">
          <select class="form-select" id="filter-tier" aria-label="Filter by availability">
            <option value="">Any progress</option>
            <option value="1">Has HTR text</option>
            <option value="2">Digitized</option>
            <option value="3">Archive only</option>
          </select>
        </div>
        <div class="col-md-2 text-end">
          <span class="small text-body-secondary" id="result-count" role="status" aria-live="polite"></span>
        </div>
      </div>

      <div class="table-responsive table-sticky" tabindex="0" role="region" aria-label="Source overview, scrollable table">
        <table class="table table-hover table-sm align-middle" id="sources-table">
          <thead>
            <tr>
              <th scope="col"><span class="visually-hidden">Facsimile thumbnail</span></th>
              <th scope="col" data-sort="kategorie" tabindex="0" aria-sort="none">Category <span class="sort-icon" aria-hidden="true">↕</span></th>
              <th scope="col" data-sort="signatur" tabindex="0" aria-sort="none">Shelfmark <span class="sort-icon" aria-hidden="true">↕</span></th>
              <th scope="col" data-sort="titel" tabindex="0" aria-sort="none">Title <span class="sort-icon" aria-hidden="true">↕</span></th>
              <th scope="col" data-sort="datierung" tabindex="0" aria-sort="none">Date <span class="sort-icon" aria-hidden="true">↕</span></th>
              <th scope="col" data-sort="seiten" tabindex="0" aria-sort="none" class="text-end text-nowrap">Pages <span class="sort-icon" aria-hidden="true">↕</span></th>
              <th scope="col" data-sort="tier" tabindex="0" aria-sort="none">Progress <span class="sort-icon" aria-hidden="true">↕</span></th>
              <th scope="col">Action</th>
            </tr>
          </thead>
          <tbody id="sources-body">
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="text-center py-4 border-top small text-body-secondary">
    <p class="mb-0">DoCTA | Digital Humanities Craft OG | <a href="about.html">About &amp; Imprint</a> | <a href="https://github.com/DigitalHumanitiesCraft/DoCTA" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initNav, initBanner } from './js/app.js';
    import { loadJSON } from './js/data-loader.js';
    import { escapeHTML, escapeAttr, formatDate, debounce } from './js/utils.js';

    initNav('dashboard');
    initBanner();

    // Archival titles and shelfmarks stay in their original German; the closed
    // category vocabulary gets an English display label with the source term.
    const CATEGORY_EN = {
      'Anderes': 'Other',
      'Burgeninventar': 'Castle inventory',
      'Hof- und Speiseordnungen': 'Court and table ordinances',
      'Kircheninventar': 'Church inventory',
      'Kopialbuch': 'Copybook',
      'Landtagsakten': 'Diet records',
      'Literatur': 'Literature',
      'Personeninventar': 'Personal inventory',
      'Rechnungen': 'Accounts',
      'Repertorium': 'Repertory',
    };
    const catLabel = (kat) => CATEGORY_EN[kat] || kat;

    // Pipeline progress per source: filled = reached, outline = pending.
    // TEI and Edited are pending for the whole corpus until those stages ship.
    function stageIcons(s) {
      const stages = [
        { key: 'F', label: 'Facsimile', done: s.tier === 1 || s.tier === 2 },
        { key: 'H', label: 'HTR text', done: !!(s.transkribus && s.transkribus.has_text) },
        { key: 'T', label: 'TEI', done: false },
        { key: 'E', label: 'Edited', done: false },
      ];
      return `<span class="stages">` + stages.map(st =>
        `<span class="stage ${st.done ? 'stage--done' : 'stage--todo'}" title="${st.label}${st.done ? '' : ': pending'}">${st.key}<span class="visually-hidden"> ${st.label}${st.done ? ' done' : ' pending'}</span></span>`
      ).join('') + `</span>`;
    }

    let allSources = [];
    let thumbByDocId = new Map();
    let sortKey = 'signatur';
    let sortDir = 1;

    // Scaled IIIF variant of the first written page; the image stays external.
    function thumbCell(s) {
      const docId = s.transkribus?.doc_id;
      const t = docId ? thumbByDocId.get(Number(docId)) : null;
      if (!t) return '';
      const src = t.thumb.replace('/full/max/', '/full/,120/');
      return `<a href="viewer.html?doc=${docId}&page=${t.thumb_page}" class="thumb-link"
        aria-label="Open ${escapeAttr(s.signatur)} in the viewer">
        <img src="${escapeAttr(src)}" alt="" loading="lazy" decoding="async"></a>`;
    }

    function renderTable(sources) {
      const tbody = document.getElementById('sources-body');
      document.getElementById('result-count').textContent = `${sources.length.toLocaleString('en-GB')} sources`;

      if (sources.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-body-secondary text-center py-4">No sources found</td></tr>';
        return;
      }

      tbody.innerHTML = sources.map(s => {
        // Only full-text sources get an action; availability is already the Status column
        const action = s.transkribus && s.transkribus.has_text
          ? `<a href="viewer.html?doc=${s.transkribus.doc_id}" class="btn btn-outline-accent btn-sm">Open</a>`
          : '';
        return `<tr>
          <td class="thumb-cell">${thumbCell(s)}</td>
          <td class="cell-cat">${escapeHTML(catLabel(s.kategorie))}</td>
          <td class="font-monospace small">${escapeHTML(s.signatur)}</td>
          <td><span class="cell-truncate" title="${escapeAttr(s.titel)}">${escapeHTML(s.titel)}</span></td>
          <td class="small">${escapeHTML(formatDate(s.datierung))}</td>
          <td class="small num">${s.seiten != null ? s.seiten : '–'}</td>
          <td>${stageIcons(s)}</td>
          <td>${action}</td>
        </tr>`;
      }).join('');
    }

    function getFilteredSources() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const katFilter = document.getElementById('filter-kategorie').value;
      const tierFilter = document.getElementById('filter-tier').value;

      let filtered = allSources;

      if (query) {
        filtered = filtered.filter(s =>
          s.signatur.toLowerCase().includes(query) ||
          s.titel.toLowerCase().includes(query) ||
          (s.datierung.raw || '').toLowerCase().includes(query)
        );
      }

      if (katFilter) {
        filtered = filtered.filter(s => s.kategorie === katFilter);
      }

      if (tierFilter) {
        filtered = filtered.filter(s => s.tier === parseInt(tierFilter));
      }

      filtered.sort((a, b) => {
        let va = a[sortKey];
        let vb = b[sortKey];
        if (sortKey === 'kategorie') {
          va = catLabel(va);
          vb = catLabel(vb);
        }
        if (sortKey === 'datierung') {
          va = a.datierung.start || 0;
          vb = b.datierung.start || 0;
        }
        if (sortKey === 'seiten') {
          va = va || 0;
          vb = vb || 0;
        }
        if (typeof va === 'string') {
          return va.localeCompare(vb, 'de', { numeric: true }) * sortDir;
        }
        return ((va || 0) - (vb || 0)) * sortDir;
      });

      return filtered;
    }

    function update() {
      renderTable(getFilteredSources());
    }

    function updateSortIndicators() {
      document.querySelectorAll('th[data-sort]').forEach(h => {
        const icon = h.querySelector('.sort-icon');
        if (h.dataset.sort === sortKey) {
          h.classList.add('sorted');
          h.setAttribute('aria-sort', sortDir === 1 ? 'ascending' : 'descending');
          if (icon) icon.textContent = sortDir === 1 ? '↑' : '↓';
        } else {
          h.classList.remove('sorted');
          h.setAttribute('aria-sort', 'none');
          if (icon) icon.textContent = '↕';
        }
      });
    }

    function sortBy(th) {
      const key = th.dataset.sort;
      if (sortKey === key) {
        sortDir *= -1;
      } else {
        sortKey = key;
        sortDir = 1;
      }
      updateSortIndicators();
      update();
    }

    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => sortBy(th));
      th.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          sortBy(th);
        }
      });
    });

    document.getElementById('search-input').addEventListener('input', debounce(update, 200));
    document.getElementById('filter-kategorie').addEventListener('change', update);
    document.getElementById('filter-tier').addEventListener('change', update);

    async function initSources() {
      try {
        const [sources, register] = await Promise.all([
          loadJSON('data/sources.json'),
          loadJSON('data/pipeline/register_summary.json').catch(() => null),
        ]);
        allSources = sources;
        if (register) {
          thumbByDocId = new Map(register.documents
            .filter(d => d.thumb)
            .map(d => [d.docId, { thumb: d.thumb, thumb_page: d.thumb_page }]));
        }

        const categories = [...new Set(allSources.map(s => s.kategorie))].sort();
        const katSelect = document.getElementById('filter-kategorie');
        categories.forEach(cat => {
          const opt = document.createElement('option');
          opt.value = cat;
          opt.textContent = `${catLabel(cat)} (${allSources.filter(s => s.kategorie === cat).length})`;
          katSelect.appendChild(opt);
        });

        updateSortIndicators();
        update();
      } catch (err) {
        const errTr = document.createElement('tr');
        const errTd = document.createElement('td');
        errTd.colSpan = 8;
        errTd.className = 'text-body-secondary text-center py-4';
        errTd.textContent = `Loading failed: ${err.message}`;
        errTr.appendChild(errTd);
        document.getElementById('sources-body').replaceChildren(errTr);
      }
    }

    initSources();
  </script>
</body>
</html>
