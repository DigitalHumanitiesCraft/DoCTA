<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploration | DoCTA</title>
  <meta name="description" content="Exploratory view of the content layer of the edited texts: entities and relations extracted from validated transcriptions.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="exp-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>

  <main id="main">
    <h1 class="visually-hidden">Exploration workbench</h1>
    <div class="exp-layout" id="exp-layout">
      <aside class="exp-sidebar" id="exp-sidebar">
        <div class="exp-views" role="tablist" aria-orientation="vertical" aria-label="Views" id="exp-views"></div>

        <div class="exp-block exp-scope">
          <span class="exp-scope__title">Thaur A 49.1 (1471)</span>
          <a href="viewer.html?doc=11328300">Open the source in the viewer</a>
        </div>

        <div class="exp-block exp-context" id="exp-context"></div>
      </aside>

      <section class="exp-main" id="exp-main-area">
        <button type="button" class="vt-btn exp-sidebar-toggle d-lg-none" id="btn-sidebar" aria-controls="exp-sidebar" aria-expanded="false" aria-label="Toggle the view sidebar" title="Toggle the view sidebar">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
        </button>
      </section>
    </div>
  </main>

  <footer class="text-center py-4 border-top small text-body-secondary">
    <p class="mb-0">DoCTA | Digital Humanities Craft OG | <a href="about.html">About &amp; Imprint</a> | <a href="https://github.com/DigitalHumanitiesCraft/DoCTA" target="_blank" rel="noopener">GitHub</a></p>
  </footer>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { initNav, initBanner } from './js/app.js';
    import { loadJSON } from './js/data-loader.js';
    import { getParams, setParams, escapeHTML, escapeAttr } from './js/utils.js';

    initNav('exploration');
    initBanner();

    const NODE_HINT = 'Select a node to see its role in the source.';
    const TYPE_LABEL = { person: 'person', place: 'place', object: 'object', time: 'time' };

    /* Provenance names who produced or verified a record. The demo extraction is
       entirely LLM output; the map carries the other two values so a later,
       mixed dataset renders without a change here. */
    const PROV_LABELS = {
      human: {
        label: 'Human',
        title: 'Established or corrected by a scholar',
      },
      workflow: {
        label: 'Workflow',
        title: 'Produced by a deterministic pipeline step, no model involved',
      },
      llm: {
        label: 'LLM',
        title: 'Extracted by an LLM agent in the prototype phase; not verified by a scholar',
      },
    };

    const DEFAULT_PROVENANCE = 'llm';

    function provChip(prov) {
      const p = PROV_LABELS[prov] ? prov : DEFAULT_PROVENANCE;
      const { label, title } = PROV_LABELS[p];
      return `<span class="prov-chip prov-chip--${p}" title="${escapeAttr(title)}">${escapeHTML(label)}</span>`;
    }

    function typeLegend(types) {
      return types.map(t => `<span class="entity entity--${t}">${TYPE_LABEL[t]}</span>`).join(' ');
    }

    /* One registration per view: an entry here plus its render function. */
    const VIEWS = [
      {
        id: 'network',
        label: 'Network',
        context: () => `<p class="mb-2" id="net-detail" aria-live="polite">${NODE_HINT}</p>` +
          '<p class="mb-2"><span class="legend-dot legend-person" aria-hidden="true"></span> person &nbsp;' +
          '<span class="legend-dot legend-place" aria-hidden="true"></span> place<br>' +
          'Node size follows the number of attested relations; edge labels name the relation type from the source.</p>' +
          `<p class="mb-0">Provenance ${provChip('llm')} for every node and edge of this network.</p>`,
        render: renderNetwork,
      },
      {
        id: 'entities',
        label: 'Entities',
        context: () => `<p class="mb-2">${typeLegend(['person', 'place', 'object', 'time'])}</p>` +
          `<p class="mb-0">Provenance ${provChip('human')} ${provChip('workflow')} ${provChip('llm')}<br>` +
          'Every record of this extraction carries LLM provenance.</p>',
        render: renderEntities,
      },
    ];

    const layout = document.getElementById('exp-layout');
    const tablist = document.getElementById('exp-views');
    const mainArea = document.getElementById('exp-main-area');
    const context = document.getElementById('exp-context');

    for (const view of VIEWS) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'exp-view-btn';
      tab.id = `tab-${view.id}`;
      tab.setAttribute('role', 'tab');
      tab.textContent = view.label;
      tab.setAttribute('aria-controls', `panel-${view.id}`);
      tab.setAttribute('aria-selected', 'false');
      tab.tabIndex = -1;
      tab.addEventListener('click', () => activate(view.id));
      tablist.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'exp-panel';
      panel.id = `panel-${view.id}`;
      panel.setAttribute('role', 'tabpanel');
      panel.tabIndex = 0;
      panel.setAttribute('aria-labelledby', tab.id);
      mainArea.appendChild(panel);

      view.tab = tab;
      view.panel = panel;
      view.ready = false;
    }

    tablist.addEventListener('keydown', evt => {
      const keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
      const i = VIEWS.findIndex(v => v.tab === document.activeElement);
      if (i < 0) return;
      let next = null;
      if (evt.key in keys) next = (i + keys[evt.key] + VIEWS.length) % VIEWS.length;
      else if (evt.key === 'Home') next = 0;
      else if (evt.key === 'End') next = VIEWS.length - 1;
      if (next === null) return;
      evt.preventDefault();
      activate(VIEWS[next].id);
      VIEWS[next].tab.focus();
    });

    function activate(id) {
      const view = VIEWS.find(v => v.id === id) || VIEWS[0];
      for (const v of VIEWS) {
        const on = v === view;
        v.tab.setAttribute('aria-selected', String(on));
        v.tab.tabIndex = on ? 0 : -1;
        v.panel.classList.toggle('is-active', on);
      }
      context.innerHTML = view.context();
      setParams({ view: view.id });
      layout.classList.remove('exp-layout--sidebar-open');
      toggleBtn.setAttribute('aria-expanded', 'false');
      if (!view.ready) {
        view.ready = true;
        view.render(view.panel).catch(err => {
          view.panel.innerHTML = `<p class="p-3 mb-0">${escapeHTML(view.label)} could not be loaded: ${escapeHTML(err.message)}</p>`;
        });
      } else if (view.onShow) {
        view.onShow();
      }
    }

    const toggleBtn = document.getElementById('btn-sidebar');
    toggleBtn.addEventListener('click', () => {
      const open = layout.classList.toggle('exp-layout--sidebar-open');
      toggleBtn.setAttribute('aria-expanded', String(open));
    });

    async function renderNetwork(panel) {
      const data = await loadJSON('data/demo/thaur_network.json');
      const degree = {};
      for (const e of data.edges) {
        degree[e.source] = (degree[e.source] || 0) + 1;
        degree[e.target] = (degree[e.target] || 0) + 1;
      }
      const elements = [
        ...data.nodes.map(n => ({ data: { ...n, degree: degree[n.id] || 1 } })),
        ...data.edges.map(e => ({ data: e })),
      ];

      const cyEl = document.createElement('div');
      cyEl.id = 'cy';
      cyEl.setAttribute('role', 'img');
      cyEl.setAttribute('aria-label', 'Relation network of the Thaur inventory: persons and places connected by attested relations');
      panel.appendChild(cyEl);

      const tools = document.createElement('div');
      tools.className = 'exp-tools';
      tools.innerHTML = '<button type="button" class="vt-btn" id="btn-net-fit" aria-label="Fit the network to the view" title="Fit to view">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 5.75V2h3.75M10.25 2H14v3.75M14 10.25V14h-3.75M5.75 14H2v-3.75"/></svg></button>';
      panel.appendChild(tools);

      const css = getComputedStyle(document.documentElement);
      const token = name => css.getPropertyValue(name).trim();

      const { default: cytoscape } = await import('./lib/cytoscape.esm.min.mjs');
      const cy = cytoscape({
        container: cyEl,
        elements,
        layout: { name: 'cose', animate: false, padding: 30 },
        style: [
          { selector: 'node', style: {
              'label': 'data(label)', 'text-valign': 'bottom', 'text-halign': 'center',
              'font-size': '10px', 'text-margin-y': 5, 'text-max-width': '110px', 'text-wrap': 'ellipsis',
              'width': 'mapData(degree, 1, 8, 14, 34)', 'height': 'mapData(degree, 1, 8, 14, 34)',
          } },
          { selector: 'node[type="person"]', style: { 'background-color': token('--ent-person') } },
          { selector: 'node[type="place"]', style: { 'background-color': token('--ent-place'), 'shape': 'diamond' } },
          { selector: 'edge', style: {
              'width': 1.5, 'line-color': token('--border-custom'), 'curve-style': 'bezier',
              'target-arrow-shape': 'triangle', 'target-arrow-color': token('--border-custom'), 'arrow-scale': 0.8,
              'label': 'data(label)', 'font-size': '7px', 'color': token('--text-muted-custom'),
              'text-rotation': 'autorotate', 'text-background-color': token('--bg-primary'),
              'text-background-opacity': 0.85, 'text-background-padding': '1px',
          } },
          { selector: 'node:selected', style: { 'border-width': 3, 'border-color': token('--accent') } },
        ],
      });

      cy.on('tap', 'node', evt => {
        const d = evt.target.data();
        const detail = document.getElementById('net-detail');
        if (!detail) return;
        detail.innerHTML = `<strong>${escapeHTML(d.label)}</strong> (${escapeHTML(d.type)})` +
          (d.role ? ` · ${escapeHTML(d.role)}` : '') +
          ` · ${degree[d.id] || 0} attested relations in Thaur A 49.1 ` +
          provChip(d.provenance || data.provenance || DEFAULT_PROVENANCE);
      });
      cy.on('tap', evt => {
        if (evt.target !== cy) return;
        const detail = document.getElementById('net-detail');
        if (detail) detail.textContent = NODE_HINT;
      });

      const fit = () => { cy.resize(); cy.fit(undefined, 30); };
      document.getElementById('btn-net-fit').addEventListener('click', fit);
      VIEWS.find(v => v.id === 'network').onShow = fit;
    }

    async function renderEntities(panel) {
      const data = await loadJSON('data/demo/thaur_entities.json');
      const srcDocId = data.docId || 11328300;
      const rows = data.entities.map(e => ({
        text: e.text || '',
        normalized: e.normalized || '',
        type: e.type || '',
        provenance: e.provenance || data.provenance || DEFAULT_PROVENANCE,
        count: typeof e.count === 'number' ? e.count : null,
        // One record per occurrence in this dataset; the shape carries a list so a
        // record attested on several pages renders every attestation.
        occurrences: (Array.isArray(e.occurrences) ? e.occurrences : [e])
          .filter(o => o && typeof o.pageNr === 'number')
          .map(o => ({ pageNr: o.pageNr, lineId: o.lineId || null })),
        detail: e.role || e.category || e.isoDate || '',
      }));

      // Every attestation links back to the page it was read on
      function attestCell(r) {
        if (!r.occurrences.length) return '';
        const links = r.occurrences.map(o => {
          const title = o.lineId
            ? `Open page ${o.pageNr} in the viewer, line ${o.lineId}`
            : `Open page ${o.pageNr} in the viewer`;
          return `<a class="exp-attest__link" href="viewer.html?doc=${encodeURIComponent(srcDocId)}` +
                 `&amp;page=${o.pageNr}" title="${escapeAttr(title)}">p.&nbsp;${o.pageNr}</a>`;
        }).join('');
        const count = r.count !== null && r.count > r.occurrences.length
          ? `<span class="exp-attest__count">${r.count}×</span>`
          : '';
        return `<span class="exp-attest">${count}${links}</span>`;
      }

      const COLUMNS = [
        { key: 'text', label: 'Source form', cell: r => `<span class="exp-src">${escapeHTML(r.text)}</span>` },
        { key: 'normalized', label: 'Normalized', cell: r => escapeHTML(r.normalized) },
        { key: 'type', label: 'Type', cell: r => r.type ? `<span class="entity entity--${escapeHTML(r.type)}">${escapeHTML(TYPE_LABEL[r.type] || r.type)}</span>` : '' },
        { key: 'provenance', label: 'Provenance', cell: r => provChip(r.provenance) },
        { key: 'count', label: 'Occurrences', num: true, cell: r => r.count === null ? '' : String(r.count) },
        { key: 'attestation', label: 'Attestation', num: true,
          sort: r => r.occurrences.length ? r.occurrences[0].pageNr : null, cell: attestCell },
        { key: 'detail', label: 'Role or category', cell: r => escapeHTML(r.detail) },
      ];

      const wrap = document.createElement('div');
      wrap.className = 'exp-table-wrap';
      wrap.tabIndex = 0;
      wrap.innerHTML = '<table class="exp-table"><thead><tr>' +
        COLUMNS.map(c => `<th scope="col" data-key="${c.key}" aria-sort="none">` +
          `<button type="button" class="exp-sort" data-key="${c.key}">${c.label} <span class="exp-sort__mark" aria-hidden="true"></span></button></th>`).join('') +
        '</tr></thead><tbody id="ent-rows"></tbody></table>';
      panel.appendChild(wrap);

      const body = wrap.querySelector('#ent-rows');
      let sortKey = 'type';
      let dir = 1;

      function draw() {
        const col = COLUMNS.find(c => c.key === sortKey);
        const value = col.sort || (r => r[sortKey]);
        const sorted = rows.slice().sort((a, b) => {
          const va = value(a);
          const vb = value(b);
          if (va === null || va === '') return 1;
          if (vb === null || vb === '') return -1;
          if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
          return String(va).localeCompare(String(vb), 'de') * dir;
        });
        body.innerHTML = sorted.map(r => '<tr>' +
          COLUMNS.map(c => `<td${c.num ? ' class="num"' : ''}>${c.cell(r)}</td>`).join('') + '</tr>').join('');
        for (const th of wrap.querySelectorAll('thead th')) {
          const on = th.dataset.key === sortKey;
          th.setAttribute('aria-sort', on ? (dir === 1 ? 'ascending' : 'descending') : 'none');
          th.querySelector('.exp-sort__mark').textContent = on ? (dir === 1 ? '▲' : '▼') : '';
        }
      }

      wrap.querySelector('thead').addEventListener('click', evt => {
        const btn = evt.target.closest('.exp-sort');
        if (!btn) return;
        if (btn.dataset.key === sortKey) dir = -dir;
        else { sortKey = btn.dataset.key; dir = 1; }
        draw();
      });

      draw();
    }

    const requested = getParams().view;
    activate(VIEWS.some(v => v.id === requested) ? requested : VIEWS[0].id);
  </script>
</body>
</html>
