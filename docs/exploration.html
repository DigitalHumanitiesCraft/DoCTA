<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exploration | DoCTA</title>
  <meta name="description" content="Exploratory view of the content layer of the edited texts: entities and relations extracted from validated transcriptions.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="lib/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="exp-page">
  <a class="skip-link" href="#main">Skip to content</a>
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container-fluid px-3">
      <a class="navbar-brand" href="index.html">DoCTA</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav" id="main-nav"></ul>
      </div>
    </div>
  </nav>

  <main id="main">
    <h1 class="visually-hidden">Exploration workbench</h1>
    <div class="exp-layout" id="exp-layout">
      <aside class="exp-sidebar" id="exp-sidebar">
        <div class="exp-controls" id="exp-controls"></div>
      </aside>

      <section class="exp-main">
        <div class="exp-bar">
          <button type="button" class="vt-btn exp-sidebar-toggle d-lg-none" id="btn-sidebar" aria-controls="exp-sidebar" aria-expanded="false" aria-label="Toggle the filter sidebar" title="Toggle the filter sidebar">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
          </button>
          <div class="view-toggle exp-views" role="tablist" aria-label="Views" id="exp-views"></div>
        </div>
        <div class="exp-stage" id="exp-main-area"></div>
      </section>
    </div>
  </main>

  <!-- Filled by initFooter() in js/app.js, one definition for every page -->
  <footer class="text-center py-4 border-top small text-body-secondary"></footer>

  <script src="lib/bootstrap.bundle.min.js"></script>
  <script src="lib/d3.v7.min.js"></script>
  <script type="module">
    import { initNav, initBanner } from './js/app.js';
    import { loadJSON, loadEntities } from './js/data-loader.js';
    import { getParams, setParams, escapeHTML, escapeAttr, debounce } from './js/utils.js';
    import { createNetworkView } from './js/network.js';
    import { documentIndex, attestationList, attestationLink, viewerHref,
             provenanceBadges } from './js/entity-view.js';

    initNav('exploration');
    initBanner();

    const TYPE_LABEL = { person: 'person', place: 'place', object: 'object', time: 'time' };

    /* The aggregated graph is the shared source of both views: it names the
       documents that carry an extraction and holds the provenance of every
       record. One load serves the network and the source select of the table. */
    let graphPromise = null;
    const getGraph = () => (graphPromise ??= loadJSON('data/graph.jsonld'));

    /* Provenance names who produced or verified a record. The extraction is
       entirely LLM output; the map carries the other two values so a later,
       mixed dataset renders without a change here. */
    const PROV_LABELS = {
      human: {
        label: 'Human',
        title: 'Established or corrected by a scholar',
      },
      workflow: {
        label: 'Workflow',
        title: 'Produced by a deterministic pipeline step, no model involved',
      },
      llm: {
        label: 'LLM',
        title: 'Extracted by an LLM agent in the prototype phase; not verified by a scholar',
      },
    };

    const DEFAULT_PROVENANCE = 'llm';

    function provChip(prov) {
      const p = PROV_LABELS[prov] ? prov : DEFAULT_PROVENANCE;
      const { label, title } = PROV_LABELS[p];
      return `<span class="prov-chip prov-chip--${p}" title="${escapeAttr(title)}">${escapeHTML(label)}</span>`;
    }

    /* One registration per view: an entry here plus its render function, which
       fills the view panel and its own controls block in the sidebar. */
    const VIEWS = [
      { id: 'network', label: 'Network', render: renderNetwork },
      { id: 'entities', label: 'Entities', render: renderEntities },
      { id: 'register', label: 'Register', render: renderRegister },
    ];

    const layout = document.getElementById('exp-layout');
    const tablist = document.getElementById('exp-views');
    const mainArea = document.getElementById('exp-main-area');
    const controlsHost = document.getElementById('exp-controls');

    for (const view of VIEWS) {
      const tab = document.createElement('button');
      tab.type = 'button';
      tab.className = 'view-toggle__btn';
      tab.id = `tab-${view.id}`;
      tab.setAttribute('role', 'tab');
      tab.textContent = view.label;
      tab.setAttribute('aria-controls', `panel-${view.id}`);
      tab.setAttribute('aria-selected', 'false');
      tab.tabIndex = -1;
      tab.addEventListener('click', () => activate(view.id));
      tablist.appendChild(tab);

      const panel = document.createElement('div');
      panel.className = 'exp-panel';
      panel.id = `panel-${view.id}`;
      panel.setAttribute('role', 'tabpanel');
      panel.tabIndex = 0;
      panel.setAttribute('aria-labelledby', tab.id);
      mainArea.appendChild(panel);

      const ctrl = document.createElement('div');
      ctrl.className = 'exp-controls__set';
      ctrl.id = `controls-${view.id}`;
      controlsHost.appendChild(ctrl);

      view.tab = tab;
      view.panel = panel;
      view.controls = ctrl;
      view.ready = false;
    }

    tablist.addEventListener('keydown', evt => {
      const keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
      const i = VIEWS.findIndex(v => v.tab === document.activeElement);
      if (i < 0) return;
      let next = null;
      if (evt.key in keys) next = (i + keys[evt.key] + VIEWS.length) % VIEWS.length;
      else if (evt.key === 'Home') next = 0;
      else if (evt.key === 'End') next = VIEWS.length - 1;
      if (next === null) return;
      evt.preventDefault();
      activate(VIEWS[next].id);
      VIEWS[next].tab.focus();
    });

    function activate(id) {
      const view = VIEWS.find(v => v.id === id) || VIEWS[0];
      for (const v of VIEWS) {
        const on = v === view;
        v.tab.setAttribute('aria-selected', String(on));
        v.tab.tabIndex = on ? 0 : -1;
        v.panel.classList.toggle('is-active', on);
        v.controls.classList.toggle('is-active', on);
      }
      setParams({ view: view.id });
      layout.classList.remove('exp-layout--sidebar-open');
      toggleBtn.setAttribute('aria-expanded', 'false');
      if (!view.ready) {
        // Set before the render so a second activation does not start it twice,
        // and taken back when it fails, or the failure would be cached as ready
        // and the view would never render again.
        view.ready = true;
        view.render(view.panel, view.controls).then(api => {
          view.onShow = api && api.onShow;
          if (view.onShow) view.onShow();
        }).catch(err => {
          view.ready = false;
          view.panel.innerHTML = `<p class="p-3 mb-0">${escapeHTML(view.label)} could not be loaded: ${escapeHTML(err.message)}</p>`;
        });
      } else if (view.onShow) {
        view.onShow();
      }
    }

    const toggleBtn = document.getElementById('btn-sidebar');
    toggleBtn.addEventListener('click', () => {
      const open = layout.classList.toggle('exp-layout--sidebar-open');
      toggleBtn.setAttribute('aria-expanded', String(open));
    });

    /* The network view lives in its own module; it fills the panel and its
       controls block, and reports the fit handler back for a view switch. */
    async function renderNetwork(panel, controls) {
      const graph = await getGraph();
      return createNetworkView(panel, controls, graph);
    }

    /* The table reads one source at a time; the source select in the sidebar
       lists the documents that carry an extraction, which the graph names. */
    async function renderEntities(panel, controls) {
      const graph = await getGraph();
      const docs = (graph['@graph'] || [])
        .filter(r => r['@type'] === 'docta:Document')
        .sort((a, b) => String(a.label).localeCompare(String(b.label), 'de'));

      controls.innerHTML =
        '<div class="exp-ctrl"><label class="exp-ctrl__legend" for="ent-source">Source</label>' +
        '<select class="exp-select" id="ent-source">' +
        docs.map(d => `<option value="${escapeAttr(String(d.transkribusDocId))}">` +
          `${escapeHTML(d.label)}</option>`).join('') +
        '</select></div>' +
        '<div class="exp-ctrl"><label class="exp-ctrl__legend" for="ent-filter">Filter</label>' +
        '<input type="search" class="exp-input" id="ent-filter" autocomplete="off" ' +
        'placeholder="Source or normalized form" ' +
        'aria-describedby="ent-filter-hint"><span class="visually-hidden" id="ent-filter-hint">' +
        'Filters the table by the form read in the source and by the normalized form.</span></div>' +
        '<div class="exp-ctrl"><a class="vt-btn exp-ctrl__btn" id="ent-open" href="#">' +
        '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
        '<path d="M6.5 2.5H2.5v11h11v-4M9.5 2.5H13.5v4M13.5 2.5L7 9"/></svg> Open in the viewer</a></div>';
      const sourceSel = controls.querySelector('#ent-source');
      const filterInput = controls.querySelector('#ent-filter');
      const openLink = controls.querySelector('#ent-open');

      let srcDocId = docs.length ? docs[0].transkribusDocId : null;
      let provenance = DEFAULT_PROVENANCE;
      let rows = [];
      let query = '';

      const pageHref = pageNr => viewerHref(srcDocId, pageNr);

      const pageTitle = o => (o.lineId
        ? `Open page ${o.pageNr} in the viewer, line ${o.lineId}`
        : `Open page ${o.pageNr} in the viewer`);

      // Every attestation links back to the page it was read on. The table sits
      // on one source, so the link names the page alone. Without the line the
      // same markup serves as the one value above the table, where a line of
      // the first record would be a false statement about all of them.
      function attestCell(r, withLine = true) {
        if (!r.occurrences.length) return '';
        const links = r.occurrences.map(o => attestationLink(
          pageHref(o.pageNr),
          withLine ? pageTitle(o) : `Open page ${o.pageNr} in the viewer`,
          `p.&nbsp;${o.pageNr}`)).join('');
        const count = r.count !== null && r.count > r.occurrences.length
          ? `<span class="exp-attest__count">${r.count}×</span>`
          : '';
        return `<span class="exp-attest">${count}${links}</span>`;
      }

      /* The row itself leads back to the facsimile, so the route survives the
         suppression of the attestation column on a single-page source. */
      function sourceCell(r) {
        const form = `<span class="exp-src">${escapeHTML(r.text)}</span>`;
        const o = r.occurrences[0];
        if (!o) return form;
        return `<a class="exp-rowlink" href="${escapeAttr(pageHref(o.pageNr))}" ` +
               `title="${escapeAttr(pageTitle(o))}">${form}</a>`;
      }

      const COLUMNS = [
        { key: 'text', label: 'Source form', cell: sourceCell },
        { key: 'normalized', label: 'Normalized', cell: r => escapeHTML(r.normalized) },
        { key: 'type', label: 'Type', cell: r => r.type ? `<span class="entity entity--${escapeAttr(r.type)}">${escapeHTML(TYPE_LABEL[r.type] || r.type)}</span>` : '' },
        { key: 'provenance', label: 'Provenance', sort: () => provenance, cell: () => provChip(provenance) },
        { key: 'count', label: 'Occurrences', num: true, cell: r => r.count === null ? '' : String(r.count) },
        { key: 'attestation', label: 'Attestation', num: true,
          sort: r => r.occurrences.length ? r.occurrences[0].pageNr : null, cell: attestCell,
          uniq: r => r.occurrences.map(o => o.pageNr).join(' '),
          summary: r => attestCell(r, false) },
        { key: 'detail', label: 'Role or category', cell: r => escapeHTML(r.detail) },
      ];

      // One line above the table names both layers of the data: who extracted
      // the records and whose transcription they were read from.
      const basis = document.createElement('p');
      basis.className = 'exp-basis';
      panel.appendChild(basis);
      const summary = await loadJSON('data/pipeline/register_summary.json').catch(() => null);
      const regByDocId = new Map((summary?.documents || []).map(d => [Number(d.docId), d]));

      /* A column whose value is the same in every record of the source says
         nothing per row. It is dropped and its one value named here once; the
         record count sits at the other end of the same line. */
      const factsLine = document.createElement('p');
      factsLine.className = 'exp-facts';
      factsLine.innerHTML = '<span class="exp-facts__items"></span>' +
        '<span class="exp-facts__count"></span>';
      panel.appendChild(factsLine);
      const factsItems = factsLine.querySelector('.exp-facts__items');
      const countEl = factsLine.querySelector('.exp-facts__count');

      const wrap = document.createElement('div');
      wrap.className = 'exp-table-wrap';
      wrap.tabIndex = 0;
      wrap.innerHTML = '<table class="exp-table"><thead></thead>' +
        '<tbody id="ent-rows"></tbody></table>';
      panel.appendChild(wrap);

      const live = document.createElement('div');
      live.className = 'visually-hidden';
      live.setAttribute('aria-live', 'polite');
      panel.appendChild(live);

      const head = wrap.querySelector('thead');
      const body = wrap.querySelector('#ent-rows');
      let columns = COLUMNS;
      let sortKey = 'type';
      let dir = 1;

      /* Uniformity is decided over the whole source, not over the filtered
         subset, so the columns do not jump while the reader types. */
      function splitColumns() {
        if (rows.length < 2) return { cols: COLUMNS, facts: [] };
        const cols = [];
        const facts = [];
        for (const c of COLUMNS) {
          // What the reader sees decides, not markup that differs only in a
          // per-record title attribute.
          const key = c.uniq || c.cell;
          const first = key(rows[0]);
          if (!rows.every(r => key(r) === first)) cols.push(c);
          else {
            const html = (c.summary || c.cell)(rows[0]);
            if (html.trim()) facts.push({ label: c.label, html });
          }
        }
        return cols.length ? { cols, facts } : { cols: COLUMNS, facts: [] };
      }

      function renderHead() {
        head.innerHTML = '<tr>' + columns.map(c =>
          `<th scope="col" data-key="${c.key}" aria-sort="none">` +
          `<button type="button" class="exp-sort" data-key="${c.key}">${c.label} ` +
          '<span class="exp-sort__mark" aria-hidden="true"></span></button></th>').join('') + '</tr>';
      }

      const matches = r => !query ||
        r.text.toLowerCase().includes(query) || r.normalized.toLowerCase().includes(query);

      function draw() {
        const col = columns.find(c => c.key === sortKey) || columns[0];
        sortKey = col.key;
        const value = col.sort || (r => r[col.key]);
        const sorted = rows.filter(matches).sort((a, b) => {
          const va = value(a);
          const vb = value(b);
          if (va === null || va === '') return 1;
          if (vb === null || vb === '') return -1;
          if (typeof va === 'number' && typeof vb === 'number') return (va - vb) * dir;
          return String(va).localeCompare(String(vb), 'de') * dir;
        });
        const empty = rows.length
          ? 'No record matches the filter.'
          : 'No entity extraction for this source yet.';
        body.innerHTML = sorted.length
          ? sorted.map(r => '<tr>' +
              columns.map(c => `<td${c.num ? ' class="num"' : ''}>${c.cell(r)}</td>`).join('') + '</tr>').join('')
          : `<tr><td class="exp-table__empty" colspan="${columns.length}">${empty}</td></tr>`;
        for (const th of head.querySelectorAll('th')) {
          const on = th.dataset.key === sortKey;
          th.setAttribute('aria-sort', on ? (dir === 1 ? 'ascending' : 'descending') : 'none');
          th.querySelector('.exp-sort__mark').textContent = on ? (dir === 1 ? '▲' : '▼') : '';
        }
        const count = query
          ? `${sorted.length} of ${rows.length} records`
          : `${rows.length} record${rows.length === 1 ? '' : 's'}`;
        countEl.textContent = count;
        live.textContent = `${count} shown.`;
      }

      let loadToken = 0;

      async function load(docId) {
        const token = ++loadToken;
        openLink.href = `viewer.html?doc=${encodeURIComponent(docId)}`;
        const data = await loadEntities(docId);
        // A later source wins over a slow response; without this the rows of the
        // earlier source would land under the source id already selected.
        if (token !== loadToken) return;
        srcDocId = docId;
        // The extraction carries one provenance for all its records
        provenance = data && PROV_LABELS[data.provenance] ? data.provenance : DEFAULT_PROVENANCE;
        rows = data ? data.entities : [];
        const reg = regByDocId.get(Number(docId));
        // The extraction records one model for all its records, or none at all
        const model = data?.model ? ` ${provenanceBadges(data.model)}` : '';
        const textBasis = reg?.transcription_by === 'Inventaria'
          ? `<a href="${escapeAttr(reg.edition_url || 'https://www.inventaria.at/')}" target="_blank"` +
            ` rel="noopener" title="Opens the published edition on Transkribus Sites">` +
            `transcription by the Inventaria project</a>`
          : 'Transkribus transcription layer';
        basis.innerHTML = `Extraction ${provChip(provenance)}${model} &middot; Text basis: ${textBasis}`;

        const split = splitColumns();
        columns = split.cols;
        factsItems.innerHTML = split.facts.map(f =>
          `<span class="exp-facts__item"><span class="exp-facts__key">${escapeHTML(f.label)}</span>` +
          `${f.html}</span>`).join('');
        factsItems.hidden = !split.facts.length;
        renderHead();
        draw();
      }

      head.addEventListener('click', evt => {
        const btn = evt.target.closest('.exp-sort');
        if (!btn) return;
        if (btn.dataset.key === sortKey) dir = -dir;
        else { sortKey = btn.dataset.key; dir = 1; }
        draw();
      });

      // A failed source switch is reported in the table, where the reader looks
      const showLoadError = err => {
        body.innerHTML = `<tr><td class="exp-table__empty" colspan="${columns.length}">` +
          `Entities of this source could not be loaded: ${escapeHTML(err.message)}</td></tr>`;
      };

      sourceSel.addEventListener('change', () => {
        load(Number(sourceSel.value)).catch(showLoadError);
      });
      filterInput.addEventListener('input', debounce(() => {
        query = filterInput.value.trim().toLowerCase();
        draw();
      }, 150));
      await load(srcDocId);
    }

    /* The register view shows the corpus-wide entity index, the same entries the
       TEI standOff file data/tei/register.xml holds and under the same ids, so
       an entry read here is citable in the edition. One tab per entity type;
       within a tab the entries stand alphabetically by normalised form. */
    const REG_TYPES = [
      { key: 'person', rdf: 'docta:Person', label: 'Persons' },
      { key: 'place', rdf: 'docta:Place', label: 'Places' },
      { key: 'object', rdf: 'docta:Object', label: 'Objects' },
    ];
    const REGISTER_FILE = 'data/tei/register.xml';

    async function renderRegister(panel, controls) {
      const graph = await getGraph();
      const records = graph['@graph'] || [];
      const { label: docLabel } = documentIndex(
        records.filter(r => r['@type'] === 'docta:Document'));

      const byType = new Map(REG_TYPES.map(t => [t.key, []]));
      for (const r of records) {
        const t = REG_TYPES.find(x => x.rdf === r['@type']);
        if (!t) continue;
        const atts = r.attestation || [];
        const inDocs = (r.attestedIn || []).length
          ? new Set(r.attestedIn).size
          : new Set(atts.map(a => a.docId)).size;
        byType.get(t.key).push({
          // The graph id and the xml:id of the register entry are the same
          // string; only the JSON-LD prefix separates them.
          id: String(r['@id']).replace(/^docta:/, ''),
          label: String(r.label || ''),
          forms: r.attestedForm || [],
          atts,
          inDocs,
          search: [r.label, ...(r.attestedForm || [])].join(' ').toLowerCase(),
        });
      }
      for (const list of byType.values()) {
        list.sort((a, b) => a.label.localeCompare(b.label, 'de'));
      }

      controls.innerHTML =
        '<div class="exp-ctrl"><label class="exp-ctrl__legend" for="reg-filter">Filter</label>' +
        '<input type="search" class="exp-input" id="reg-filter" autocomplete="off" ' +
        'placeholder="Normalized or attested form" aria-describedby="reg-filter-hint">' +
        '<span class="visually-hidden" id="reg-filter-hint">Filters the register by the ' +
        'normalized form and by the spellings attested in the sources.</span></div>';
      const filterInput = controls.querySelector('#reg-filter');

      panel.innerHTML =
        '<p class="exp-basis" id="reg-basis"></p>' +
        '<div class="reg-tabs" role="tablist" aria-label="Entity types" id="reg-tabs"></div>' +
        '<p class="exp-facts"><span class="exp-facts__items"></span>' +
        '<span class="exp-facts__count"></span></p>' +
        '<div class="reg-lists" id="reg-lists"></div>' +
        '<div class="visually-hidden" aria-live="polite" id="reg-live"></div>';
      const basis = panel.querySelector('#reg-basis');
      const tablistEl = panel.querySelector('#reg-tabs');
      const factsItems = panel.querySelector('.exp-facts__items');
      const countEl = panel.querySelector('.exp-facts__count');
      const lists = panel.querySelector('#reg-lists');
      const live = panel.querySelector('#reg-live');

      /* Same statement as the entities view, made once for the whole register:
         a model produced these entries and no scholar has verified them. */
      const ident = Array.isArray(graph.provenance?.identification)
        ? graph.provenance.identification : [];
      const uniq = key => [...new Set(ident.map(e => e[key]).filter(Boolean))];
      const models = uniq('model');
      const prompts = uniq('prompt');
      const dates = uniq('date').sort();
      const dateSpan = dates.length > 1 ? `${dates[0]}–${dates[dates.length - 1]}` : (dates[0] || '');
      basis.innerHTML = `Extraction ${provChip('llm')}` +
        (models.length ? ' ' : '') + provenanceBadges(models.join(', ')) +
        (prompts.length
          ? ` &middot; Prompt ${escapeHTML(prompts.join(', '))}${dateSpan ? `, ${escapeHTML(dateSpan)}` : ''}`
          : '') +
        ` &middot; Encoded as <a href="${REGISTER_FILE}">${REGISTER_FILE}</a>`;
      factsItems.innerHTML = '<span class="exp-facts__item">' +
        '<span class="exp-facts__key">Citable address</span>' +
        `<span class="exp-src">${REGISTER_FILE}#&lt;id&gt;</span></span>`;

      for (const t of REG_TYPES) {
        const tab = document.createElement('button');
        tab.type = 'button';
        tab.className = 'reg-tab';
        tab.id = `reg-tab-${t.key}`;
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-controls', `reg-panel-${t.key}`);
        tab.setAttribute('aria-selected', 'false');
        tab.tabIndex = -1;
        // The dot repeats the shape and hue of the network filter chips, so the
        // same entity type reads the same in both views; the label carries it
        // without colour.
        tab.innerHTML = `<span class="net-filter__dot net-filter__dot--${t.key}" aria-hidden="true"></span>` +
          `${escapeHTML(t.label)} <span class="reg-tab__n"></span>`;
        tab.addEventListener('click', () => select(t.key));
        tablistEl.appendChild(tab);

        const p = document.createElement('div');
        p.className = 'reg-panel';
        p.id = `reg-panel-${t.key}`;
        p.setAttribute('role', 'tabpanel');
        p.setAttribute('aria-labelledby', tab.id);
        p.tabIndex = 0;
        lists.appendChild(p);

        t.tab = tab;
        t.host = p;
        t.countEl = tab.querySelector('.reg-tab__n');
      }

      tablistEl.addEventListener('keydown', evt => {
        const step = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
        const i = REG_TYPES.findIndex(t => t.tab === document.activeElement);
        if (i < 0) return;
        let next = null;
        if (evt.key in step) next = (i + step[evt.key] + REG_TYPES.length) % REG_TYPES.length;
        else if (evt.key === 'Home') next = 0;
        else if (evt.key === 'End') next = REG_TYPES.length - 1;
        if (next === null) return;
        evt.preventDefault();
        select(REG_TYPES[next].key);
        REG_TYPES[next].tab.focus();
      });

      // Every attestation keeps the route back to the facsimile; the line the
      // form was read in is named in the link title, where it does not crowd
      // the list of pages.
      const attHTML = e => (e.atts.length
        ? attestationList(e.atts, docLabel, { className: 'reg-att', detail: 'title' })
        : '');

      function entryHTML(e) {
        const forms = e.forms.length
          ? '<div class="reg-entry__row"><span class="reg-entry__key">Spellings</span>' +
            `<span class="exp-src">${escapeHTML(e.forms.join(', '))}</span></div>`
          : '';
        return '<li class="reg-entry"><div class="reg-entry__head">' +
          `<h3 class="reg-entry__name">${escapeHTML(e.label)}</h3>` +
          `<a class="reg-entry__id" href="${REGISTER_FILE}#${escapeAttr(e.id)}" ` +
          `title="${escapeAttr(`Entry ${e.id} in the TEI entity register`)}">#${escapeHTML(e.id)}</a>` +
          `<span class="reg-entry__docs">in ${e.inDocs} document${e.inDocs === 1 ? '' : 's'}</span>` +
          '</div>' + forms +
          '<div class="reg-entry__row"><span class="reg-entry__key">Attested</span>' +
          attHTML(e) + '</div></li>';
      }

      let active = REG_TYPES[0].key;
      let query = '';

      function draw() {
        let shown = 0;
        let total = 0;
        for (const t of REG_TYPES) {
          const all = byType.get(t.key);
          const list = query ? all.filter(e => e.search.includes(query)) : all;
          // The heading carries the panel for a screen reader and puts the entry
          // names of the list at a level below it.
          t.host.innerHTML = `<h2 class="visually-hidden">${escapeHTML(t.label)} in the entity register</h2>` +
            (list.length
              ? `<ul class="reg-list">${list.map(entryHTML).join('')}</ul>`
              : `<p class="reg-empty">${all.length
                ? 'No entry matches the filter.' : 'No entry of this type in the register.'}</p>`);
          t.countEl.textContent = String(list.length);
          if (t.key === active) {
            shown = list.length;
            total = all.length;
          }
        }
        const label = REG_TYPES.find(t => t.key === active).label.toLowerCase();
        const count = query
          ? `${shown} of ${total} ${label}`
          : `${total} ${label}`;
        countEl.textContent = count;
        live.textContent = `${count} shown.`;
      }

      function select(key) {
        active = REG_TYPES.some(t => t.key === key) ? key : REG_TYPES[0].key;
        for (const t of REG_TYPES) {
          const on = t.key === active;
          t.tab.setAttribute('aria-selected', String(on));
          t.tab.tabIndex = on ? 0 : -1;
          t.host.classList.toggle('is-active', on);
        }
        setParams({ type: active });
        draw();
      }

      filterInput.addEventListener('input', debounce(() => {
        query = filterInput.value.trim().toLowerCase();
        setParams({ q: query });
        draw();
      }, 150));

      // The tab and the filter are part of the address of the view
      const start = getParams();
      if (start.q) {
        filterInput.value = start.q;
        query = start.q.trim().toLowerCase();
      }
      select(start.type);
    }

    const requested = getParams().view;
    activate(VIEWS.some(v => v.id === requested) ? requested : VIEWS[0].id);
  </script>
</body>
</html>
